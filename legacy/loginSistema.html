<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos Salo :: Login Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
            <h2 class="text-center mb-4">Acceso Sistema Salo</h2>
            
            <form id="login-sistema-form">
                <div class="mb-3">
                    <label for="username-sys" class="form-label">Usuario</label>
                    <input type="text" id="username-sys" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password-sys" class="form-label">Contraseña</label>
                    <input type="password" id="password-sys" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar a Consola</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/usuariosSistema.js"></script>
    <script src="js/gestionUsuariosSys.js"></script>
    <script src="js/loginSistema.js"></script>





</body>
</html>
