<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
        <h2 class="text-center mb-4">Acceso Sistema Salo</h2>
        
        <form [formGroup]="loginSysForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" formControlName="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" formControlName="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loginSysForm.invalid">
                Ingresar a Consola
            </button>
        </form>
    </div>
</div>
