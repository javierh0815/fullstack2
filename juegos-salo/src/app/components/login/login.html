<div class="juegos-grid justify-content-center">
  <div class="w-100 px-3" style="max-width: 400px;">
    <h2 class="text-center text-white mb-4">Iniciar Sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()" class="w-100">
      <div class="mb-3">
        <label class="form-label text-white">Nombre de Usuario</label>
        <input type="text" class="form-control" formControlName="username" placeholder="Tu usuario">
      </div>

      <div class="mb-3">
        <label class="form-label text-white">Contraseña</label>
        <input type="password" class="form-control" formControlName="password" placeholder="Tu contraseña">
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
        Ingresar
      </button>
    </form>
  </div>
</div>
