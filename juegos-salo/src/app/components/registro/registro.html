<div class="juegos-grid justify-content-center">
    <div class="w-100 px-3" style="max-width: 450px;">
        
        <h2 class="text-center text-white mb-4">Formulario de Registro</h2>
        
        <form [formGroup]="registroForm" (ngSubmit)="registrar()" class="registro-form w-100">
            
            <div class="mb-3">
                <label for="nombre" class="form-label text-white">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre" formControlName="nombre" placeholder="Ingresa tu nombre completo">
            </div>

            <div class="mb-3">
                <label for="username" class="form-label text-white">Nombre de Usuario</label>
                <input type="text" class="form-control" id="username" formControlName="username" placeholder="Elige un nombre de usuario único">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label text-white">Contraseña</label>
                <input type="password" class="form-control" id="password" formControlName="password" placeholder="Crea una contraseña segura">
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label text-white">Confirmar Contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" formControlName="confirmPassword" placeholder="Confirma tu contraseña">
                <div *ngIf="registroForm.hasError('passwordsNoCoinciden') && registroForm.get('confirmPassword')?.touched" class="text-danger small">
                    Las contraseñas no coinciden.
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label text-white">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" formControlName="email" placeholder="Ingresa tu correo electrónico">
            </div>

            <div class="mb-3">
                <label for="fechaNacimiento" class="form-label text-white">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="fechaNacimiento" formControlName="fechaNacimiento">
                <div *ngIf="registroForm.get('fechaNacimiento')?.hasError('menorEdad')" class="text-danger small">
                    Debes ser mayor de 13 años.
                </div>
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label text-white">Dirección</label>
                <input type="text" class="form-control" id="direccion" formControlName="direccion" placeholder="Ingresa tu dirección">
            </div>

            <div class="d-flex flex-column gap-2 mt-4">
                <button type="submit" class="btn btn-primary w-100" [disabled]="registroForm.invalid">Registrarse</button>
                <button type="reset" class="btn btn-secondary w-100" (click)="registroForm.reset()">Limpiar</button>
            </div>
        </form>

    </div>
</div>
