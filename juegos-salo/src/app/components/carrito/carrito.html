<table class="table text-white">
  <thead>
    <tr>
      <th>Producto</th>
      <th>Precio</th>
      <th>Fecha</th>
    </tr>
  </thead>
  <tbody id="lista-carrito">
    <tr *ngFor="let item of items">
      <td>{{ item.nombre }}</td>
      <td>${{ (item.precio || 0).toLocaleString() }}</td>
      <td>{{ item.fecha | date:'shortDate' }}</td>
    </tr>
    
    <tr *ngIf="items.length === 0">
      <td colspan="3" class="text-center">Tu carrito está vacío.</td>
    </tr>
  </tbody>
</table>

<h3 id="total-carrito" class="text-white">Total: ${{ (total || 0).toLocaleString() }}</h3>
