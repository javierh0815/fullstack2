    <main>
        <div class="juegos-grid justify-content-center">
            
            <div class="w-100 px-3" style="max-width: 450px;">
                
                <h2 class="text-center text-white mb-4">Modificar Perfil</h2>
                
                <form class="modifica-form w-100" id="modifica-form">
                    <div class="mb-3">
                        <label for="nombre" class="form-label text-white">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre completo">
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label text-white">Nombre de Usuario</label>
                        <input type="text" class="form-control" id="username" placeholder="Elige un nombre de usuario único">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-white">Contraseña</label>
                        <input type="password" class="form-control" id="password" placeholder="Crea una contraseña segura">
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label text-white">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirma tu contraseña">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-white">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo electrónico">
                    </div>

                    <div class="mb-3">
                        <label for="fechaNacimiento" class="form-label text-white">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento">
                    </div>

                    <div class="mb-3">
                        <label for="direccion" class="form-label text-white">Dirección</label>
                        <input type="text" class="form-control" id="direccion" placeholder="Ingresa tu dirección">
                    </div>

                    <div class="d-flex flex-column gap-2 mt-4">
                        <button type="submit" class="btn btn-primary w-100">Modificar Perfil</button>
                        <button type="reset" class="btn btn-secondary w-100">Limpiar</button>
                    </div>
                </form>

            </div>

        </div>
    </main>
